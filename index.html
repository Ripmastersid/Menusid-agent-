    <script type="text/javascript">
      window.__RECORDER_SCRIPT_HASH__ = "5b84cc33555ef282e0c740fc7d4e311b";
      (function () {
        function loadScript(e, o) {
          var t = document.createElement("script");
          (t.async =!0),
            (t.src = e),
            (t.onload = o),
            document.head.appendChild(t);
        }
        function init() {
          window.initArenaRecorder &&
            window.initArenaRecorder(window.__RECORDER_SCRIPT_HASH__);
        }
        "complete" === document.readyState
         ? init()
          : window.addEventListener("load", init),
          loadScript(
            "https://cdn.jsdelivr.net/npm/arena-recorder-sdk@latest/dist/index.min.js"
          );
      })();
    </script>
